name: Build OpenSTA for Windows

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*' # Triggers on version tags like v1.0.0, v2.1.3
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup vcpkg & Cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgGitCommitId: 'latest'

      - name: Install Dependencies via vcpkg
        run: |
          vcpkg install tcl:x64-windows cudd:x64-windows bison:x64-windows flex:x64-windows

      - name: Configure CMake
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DSTA_GUI=OFF

      - name: Build OpenSTA
        run: |
          cmake --build build --config Release --parallel

      - name: Verify Build
        run: |
          if (Test-Path "build\app\sta.exe") {
            Write-Output "SUCCESS: OpenSTA Compiled Successfully!"
            .\build\app\sta.exe -version
          } else {
            Write-Error "ERROR: sta.exe binary not found."
            exit 1
          }

      # New Step: Packages everything into a clean staging folder and zips it up
      - name: Package Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          New-Item -ItemType Directory -Force -Path staging
          Copy-Item "build\app\sta.exe" -Destination "staging\"
          if (Test-Path "build\app\*.dll") {
            Copy-Item "build\app\*.dll" -Destination "staging\"
          }
          Compress-Archive -Path "staging\*" -DestinationPath "OpenSTA-Windows-x64.zip" -Force

      # New Step: Generates the official GitHub Release and uploads the .zip archive
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: OpenSTA-Windows-x64.zip
          name: Release ${{ github.ref_name }}
          body: |
            Automated Windows x64 build for OpenSTA version ${{ github.ref_name }}.
            
            ### Assets Included
            * `OpenSTA-Windows-x64.zip`: Contains the standalone executable (`sta.exe`) and necessary system dependencies.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
